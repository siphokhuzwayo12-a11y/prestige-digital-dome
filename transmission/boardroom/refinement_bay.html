<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestige Dome - Refinement Bay Boardroom</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0d1117; font-family: sans-serif; color: #c9d1d9; }
        #key-guard { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        input { padding: 12px 18px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; font-size: 16px; margin-bottom: 12px; text-align: center; width: 280px; }
        button { padding: 10px 24px; border-radius: 6px; border: none; background: #238636; color: #fff; font-size: 16px; cursor: pointer; }
        button:hover { background: #2ea043; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>
    <div id="key-guard">
        <h2>Refinement Bay Boardroom</h2>
        <p>Enter Steward Access Key to unlock MiroTalk conference:</p>
        <input type="password" id="access-key" placeholder="Steward Key..." />
        <button onclick="unlockBoardroom()">Authorize Access</button>
    </div>

    <iframe id="mirotalk-frame" allow="camera; microphone; display-capture; autoplay; clipboard-write"></iframe>

    <script>
        function unlockBoardroom() {
            const key = document.getElementById('access-key').value;
            if (key.trim() !== "") {
                document.getElementById('key-guard').style.display = 'none';
                const iframe = document.getElementById('mirotalk-frame');
                // Embedded MiroTalk P2P Room locked under room key
                iframe.src = "https://p2p.mirotalk.com/join/PrestigeRefinementBay_" + encodeURIComponent(key);
                iframe.style.display = 'block';
            } else {
                alert("Steward access key required.");
            }
        }
    </script>
</body>
</html>
