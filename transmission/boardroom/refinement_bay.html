<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestige Dome - Pristine Refinement Bay</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #c9d1d9; }
        #key-guard { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        input { padding: 12px 18px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; font-size: 16px; margin-bottom: 12px; text-align: center; width: 320px; }
        button { padding: 10px 24px; border-radius: 6px; border: none; background: #238636; color: #fff; font-size: 15px; cursor: pointer; margin: 4px; }
        button:hover { background: #2ea043; }
        button.btn-danger { background: #da3633; }
        #app-container { display: none; width: 100%; height: 100vh; flex-direction: column; }
        #control-bar { height: 50px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        #mirotalk-frame { flex: 1; border: none; width: 100%; }
        #signal-status { font-size: 13px; color: #3fb950; font-weight: 500; }
    </style>
</head>
<body>

    <div id="key-guard">
        <h2>Refinement Bay Boardroom</h2>
        <p style="color: #8b949e;">Pristine Reception Engine • Zero Distortion • High-Fidelity P2P Matrix</p>
        <input type="password" id="access-key" placeholder="Enter Steward Access Key..." />
        <br />
        <button onclick="unlockBoardroom()">Initialize Resonance Session</button>
    </div>

    <div id="app-container">
        <div id="control-bar">
            <div>
                <strong>Prestige Dome Refinement Bay</strong> | <span id="signal-status">? Resonant P2P Lock Established</span>
            </div>
            <div>
                <button id="record-btn" onclick="toggleVoiceRecording()">??? Pristine Voice Note</button>
            </div>
        </div>
        <iframe id="mirotalk-frame" allow="camera; microphone; display-capture; autoplay; clipboard-write"></iframe>
    </div>

    <script>
        function unlockBoardroom() {
            const key = document.getElementById('access-key').value.trim();
            if (key !== "") {
                document.getElementById('key-guard').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                
                const iframe = document.getElementById('mirotalk-frame');
                // Launch MiroTalk P2P with high-fidelity media flags
                iframe.src = "https://p2p.mirotalk.com/join/PrestigeRefinementBay_" + encodeURIComponent(key) + "#config.audioQuality=48000&config.opusMaxAverageBitrate=510000";
            } else {
                alert("Steward Access Key required for lock execution.");
            }
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleVoiceRecording() {
            const btn = document.getElementById('record-btn');
            const status = document.getElementById('signal-status');

            if (!isRecording) {
                try {
                    // Pristine audio constraints for zero-distortion voice notes
                    const audioConstraints = {
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            sampleRate: 48000,
                            sampleSize: 16,
                            channelCount: 2
                        }
                    };

                    const stream = await navigator.mediaDevices.getUserMedia(audioConstraints);
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(audioBlob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = `pristine_voice_note_${Date.now()}.webm`;
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => URL.revokeObjectURL(url), 100);
                        status.textContent = "? Pristine Voice Note Saved to Vault Channel";
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.textContent = "?? Stop & Lock Recording";
                    btn.className = "btn-danger";
                    status.textContent = "? Recording Active: High-Fidelity Audio Stream";
                } catch (err) {
                    alert("Audio device access error: " + err);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.textContent = "??? Pristine Voice Note";
                btn.className = "";
            }
        }
    </script>
</body>
</html>
